<div class="flex h-screen bg-dashboard-primary font-inter overflow-hidden relative">
    <div class="absolute inset-0 left-80 pointer-events-none" style="background: radial-gradient(108.84% 161.25% at -4.03% 104.12%, rgba(1,53,64,0.45) 0%, rgba(65,104,112,0.45) 25%, rgba(128,154,160,0.135) 44.73%, rgba(246,247,237,0.45) 100%); transform: matrix(-1,0,0,1,0,0);"></div>

    <aside class="w-[320px] bg-white flex flex-col border-r border-[#e5e7eb] z-10 shrink-0">
        <div class="pt-10 pl-8 pb-8">
            <h1 class="font-poppins font-bold text-[20px] leading-7.5 text-[#0f172a]">Sistema de Monitoria</h1>
            <p class="font-poppins text-[14px] leading-5.25 text-[#64748b] mt-1">Administrador</p>
        </div>

        <nav class="flex-1 px-6 space-y-2 overflow-y-auto mt-4">
            <a routerLink="/admin" routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                Dashboard
            </a>

            <a routerLink="/admin/ies" routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1v1H9V7zm5 0h1v1h-1V7zm-5 4h1v1H9v-1zm5 0h1v1h-1v-1zm-5 4h1v1H9v-1zm5 0h1v1h-1v-1z"/></svg>
                IES
            </a>

            <a routerLink="/admin/escolas" routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg>
                Escolas
            </a>

            <a routerLink="/admin/professores" routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                Professores
            </a>

            <a routerLink="/admin/cursos" routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                Cursos
            </a>

            <a routerLink="/admin/matrizes" routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                Matrizes
            </a>

            <a routerLink="/admin/disciplinas" routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Disciplinas
            </a>

            <a routerLink="/admin/relatorios" routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Relatórios
            </a>

            <a routerLink="/admin/fechamento"  routerLinkActive="bg-[#eff6ff] text-[#2563eb]" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-4 py-3 text-[#64748b] rounded-xl font-poppins font-medium text-[16px] transition-colors hover:bg-slate-50 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2zM9 16l2 2 4-4" />
                </svg>
                Fechamento
            </a>
        </nav>

        <div class="px-6 pb-12 mt-auto">
          <a (click)="fazerLogout()" class="w-full flex items-center justify-center gap-2 px-4 h-12 border border-slate-300 text-black rounded-xl font-poppins font-medium text-[16px] hover:bg-slate-50 transition-colors cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Sair
          </a>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto overflow-x-hidden p-10 z-10 relative">
        <router-outlet></router-outlet>
    </main>
</div>
