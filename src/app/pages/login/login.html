<div class="min-h-screen bg-ucsal-blue flex items-center justify-center p-4 relative overflow-hidden font-poppins">
    <div class="absolute -top-50 -left-50 w-200 h-200 rounded-full" style="background: radial-gradient(50% 50% at 50% 50%, rgba(0,128,76,0.25) 0%, rgba (115,115,115,0) 100%);"></div>
    <div class="absolute -bottom-37.5 -right-37.5 w-150 h-150 rounded-full" style="background: radial-gradient(50% 50% at 50% 50%, rgba(0, 128, 76, 0.25) 0%, rgba(115, 115, 115, 0) 100%);"></div>

    <div class="relative w-full max-w-240 h-auto min-h-145 rounded-[28px] overflow-hidden flex flex-col md:flex-row shadow-[0px_40px_100px_rgba(0,0,0,0.5) border border-white/5 z-10">
        <div class="w-full md:w-135 relative p-12 flex flex-col" style="background: linear-gradient(220.92deg, #021829 0%, #001f3f 50%, #0a2a50 100%);">
            <div class="absolute -top-8 left-82.5 w-65 h-65 rounded-full border-[1.5px] border-ucsal-lime"></div>
            <div class="absolute top-5 left-95 w-40 h-40 rounded-full border border-ucsal-green/20"></div>
            <div class="absolute top-82.5 -left-25 w-100 h-100 rounded-full border border-[#1E488F]/30"></div>
            <div class="absolute top-102.5 left-100 w-20 h-20 rounded-full bg-ucsal-lime/5"></div>
        
            <div class="relative z-10 inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-ucsal-lime/30 w-fit overflow-hidden">
                <div class="absolute top-0 w-1/2 h-full bg-linear-to-r from-transparent via-ucsal-lime/40 to to-transparent -skew-x-12 animate-shine"></div>
                <span class="relative z-10 w-1.5 h-1.5 rounded-full bg-ucsal-lime"></span>
                <span class="relative z-10 text-ucsal-lime text-[11px] font-medium tracking-[0.08em] uppercase">UCSAL - Sistema Ativo</span>
            </div>

            <div class="relative z-10 mt-10">
                <h1 class="font-poppins font-extrabold text-[42px] leading-[1.1] tracking-[-0.02em]">
                    <span class="text-ucsal-cream block">Sistema de</span>
                    <span class="text-ucsal-lime block">Monitoria</span>
                </h1>
                <p class="text-white/50 text-[14px] leading-4.5 tracking-[-0.02em] font-light mt-6 max-w-65">Controle e gestão de monitoria para alunos da Universidade Católica do Salvador.</p>
            </div>

            <div class="relative z-10 flex items-center gap-6 mt-10">
                <div class="flex flex-col">
                    <span class="font-inter font-bold text-[22px] text-ucsal-cream">156</span>
                    <span class="text-white/40 text-[11px] tracking-[-0.02em]">MONITORES</span>
                </div>
                <div class="w-px h-10 bg-ucsal-cream/10"></div>

                <div class="flex flex-col">
                    <span class="font-inter font-bold text-[22px] text-ucsal-cream">48</span>
                    <span class="text-white/40 text-[11px] tracking-[-0.02em]">PROFESSORES</span>
                </div>
                <div class="w-px h-10 bg-ucsal-cream/10"></div>

                <div class="flex flex-col">
                    <span class="font-inter font-bold text-[22px] text-ucsal-cream">25</span>
                    <span class="text-white/40 text-[11px] tracking-[-0.02em]">CURSOS</span>
                </div>
            </div>

            <div class="relative z-10 flex items-center gap-3 mt-auto pt-10">
                <div class="w-9 h-9 rounded-[10px] flex items-center justify-center" style="background: linear-gradient(135deg,#1e488f 0%, #00804c 100%);">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
                </div>
                <span class="font-inter font-semibold text-[13px] text-white/60 tracking-[0.02em]">AQS • 2026</span>
            </div>
        </div> 
<!--lado direito começa abaixo-->
        <div class="w-full md:w-105 bg-ucsal-cream relative px-8 py-12 flex flex-col justify-center">
            <div class="absolute top-0 right-0 w-30 h-1 rounded-bl-lg" style="background: linear-gradient(90deg, #dbe64c 0%, #74c365 100%);"></div>

            <div class="mb-8 mt-4">
                <h2 class="font-poppins font-bold text-[26px] text-ucsal-blue tracking-[-0.02em]">Bem Vindo de Volta</h2>
                <p class="text-slate-500 font-bold text-[13px] tracking-[-0.02em] mt-1">Acesse sua conta para continuar</p>
            </div>

            <form class="flex flex-col gap-6 w-full max-w-81">
                <div class="flex flex-col gap-2">
                    <label class="text-[12px] font-medium text-ucsal-blue tracking-[-0.02em]">TIPO DE ACESSO</label>
                    <div class="flex gap-3">
                        <button (click)="selecionarPerfil('Administrador')"  [ngClass]="perfilSelecionado === 'Administrador' ? 'border-ucsal-blue text-ucsal-blue bg-ucsal-blue/5' : 'border-slate-200 text-slate-400 hover:bg-slate-50'" type="button" class="flex-1 h-12 rounded-xl flex items-center justify-center gap-2 text-[13px] font-medium shadow-sm border-[1.5px] transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            Administrador
                        </button>
                        
                        <button type="button" (click)="selecionarPerfil('Professor')" [ngClass]="perfilSelecionado === 'Professor' ? 'border-ucsal-blue text-ucsal-blue bg-ucsal-blue/5' : 'border-slate-200 text-slate-400 hover:bg-slate-50'" class="flex-1 h-12 rounded-xl flex items-center justify-center gap-2 text-[13px] font-medium shadow-sm border-[1.5px] transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            Professor
                        </button>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[12px] font-medium text-ucsal-blue tracking-[-0.02em]">EMAIL OU MATRICULA</label>
                    <input type="text" name="email" [(ngModel)]="email" placeholder="Digite seu Acesso" class="h-12 w-full px-5 bg-white border-[1.5px] border-slate-200 rounded-xl text-[14px] text-slate-400 focus:outline-none focus:border-ucsal-blue focus:ring-1 focus:ring-ucsal-blue transition placeholder:text-slate-400">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[12px] font-medium text-ucsal-blue tracking-[-0.02em]">SENHA</label>
                    <div class="relative">
                        <input [type]="mostrarSenha ? 'text' : 'password'" name="senha" [(ngModel)]="senha" placeholder="Digite sua Senha" class="h-12 w-full px-5 bg-white border-[1.5px] border-slate-200 rounded-xl text-[14px] text-slate-400 focus:outline-none focus:border-ucsal-blue focus:ring-1 focus:ring-ucsal-blue transition placeholder:text-slate-400">
                        <button type="button" (click)="toggleSenha()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                            @if (!mostrarSenha) {
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            } @else {
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                            }
                        </button>
                    </div>
                </div>

                <button type="button" (click)="fazerLogin()" class="h-13 w-full bg-ucsal-blue hover:bg-ucsal-blue-dark text-ucsal-cream font-poppins font-bold text-[15px] tracking-[0.04em] rounded-[14px] transition mt-2">
                    {{carregando ? 'Autenticando...' : 'Entrar'}}
                </button>
            </form>

            <div class="mt-6 text-center text-[11px] tracking-[0.04em] text-slate-400 max-w-81">
                Problemas com o acesso? <a href="#" class="text-slate-500 font-medium hover:underline">Fale com o suporte</a>
            </div>
        </div>
    </div>
</div>
