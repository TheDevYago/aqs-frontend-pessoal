<router-outlet></router-outlet>

@if (toastServ.toastState$ | async; as toast) {
    <div class="fixed bottom-8 right-8 z-100 transition-all duration-300">
        <div [ngClass]="{'bg-[#166534]': toast.tipo === 'sucesso', 'bg-red-600': toast.tipo === 'erro', 'bg-[#d97706]': toast.tipo === 'aviso'}" class="px-6 py-4 rounded-xl text-white font-inter font-medium shadow-2xl flex items-center gap-3 min-w-62.5">
            @if (toast.tipo === 'sucesso') {
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            } @else if (toast.tipo === 'erro') {
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            } @else {
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            }

            <span class="text-[14px]">{{toast.mensagem}}</span>
        </div>
    </div>
}
